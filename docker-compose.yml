services:
  # ==============================================================================
  # PostgreSQL 16 Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: infrapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-infrapulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - infrapulse-net

  # ==============================================================================
  # FastAPI Backend (REST API + Ingestion Engine)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - AGENT_SECRET_TOKEN=${AGENT_SECRET_TOKEN:-infrapulse_secret_token_change_in_production}
      - PROJECT_NAME=${PROJECT_NAME:-InfraPulse}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-alerts@infrapulse.local}
      - DEFAULT_ALERT_RECIPIENT=${DEFAULT_ALERT_RECIPIENT:-admin@infrapulse.local}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infrapulse-net

  # ==============================================================================
  # React + TypeScript Dashboard (Phase 3)
  # ==============================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: infrapulse-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - infrapulse-net

volumes:
  postgres_data:
    name: infrapulse_postgres_data

networks:
  infrapulse-net:
    name: infrapulse-network
    driver: bridge
