version: "1"

databases:
  - name: infrapulse-db
    databaseName: infrapulse
    user: postgres
    plan: free
    region: singapore

services:
  - type: web
    name: infrapulse-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infrapulse-db
          property: connectionString
      - key: AGENT_SECRET_TOKEN
        value: infrapulse_secret_token_change_in_production
      - key: PROJECT_NAME
        value: InfraPulse
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: disorn.jp@gmail.com
      - key: SMTP_PASSWORD
        value: dnaybegtnxmgrolm
      - key: DEFAULT_ALERT_RECIPIENT
        value: disorn.jp@gmail.com
