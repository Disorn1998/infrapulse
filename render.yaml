version: "1"

services:
  - type: web
    name: infrapulse-backend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false  # Set via Render Dashboard → Environment Variables
      - key: AGENT_SECRET_TOKEN
        sync: false  # Set via Render Dashboard → Environment Variables
      - key: PROJECT_NAME
        value: InfraPulse
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false  # Set via Render Dashboard → Environment Variables
      - key: SMTP_PASSWORD
        sync: false  # Set via Render Dashboard → Environment Variables
      - key: DEFAULT_ALERT_RECIPIENT
        sync: false  # Set via Render Dashboard → Environment Variables
