# Render Blueprint for InfraPulse 24/7 Cloud Deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Managed Database (Free Tier)
  # -------------------------------------------------------------
  - type: postgres
    name: infrapulse-db
    plan: free
    databaseName: infrapulse
    user: postgres
    region: singapore # Closest region to Thailand for ultra-low latency

  # -------------------------------------------------------------
  # 2. FastAPI Core Backend Service (Free Web Service)
  # -------------------------------------------------------------
  - type: web
    name: infrapulse-backend
    plan: free
    region: singapore
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infrapulse-db
          property: connectionString
      - key: AGENT_SECRET_TOKEN
        value: infrapulse_secret_token_change_in_production
      - key: PROJECT_NAME
        value: InfraPulse
      - key: ENVIRONMENT
        value: production
      - key: API_V1_STR
        value: /api/v1
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: disorn.jp@gmail.com
      - key: SMTP_PASSWORD
        value: dnaybegtnxmgrolm
      - key: DEFAULT_ALERT_RECIPIENT
        value: disorn.jp@gmail.com

  # -------------------------------------------------------------
  # 3. React + TypeScript Dashboard (Free Static Site with Global CDN)
  # -------------------------------------------------------------
  - type: web
    name: infrapulse-dashboard
    plan: free
    region: singapore
    env: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: infrapulse-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
